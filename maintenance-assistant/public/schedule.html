<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technician Schedule - Maintenance Assistant</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="page">
  <div class="page-head">
    <div><h1>Technician schedule</h1><p class="muted">Daily plan per technician. Times are UTC, the same clock used for shifts and maintenance windows.</p></div>
    <div class="toolbar" style="margin:0">
      <button id="prev">Previous</button>
      <input type="date" id="date">
      <button id="today">Today</button>
      <button id="next">Next</button>
    </div>
  </div>
  <div id="err" class="err"></div>
  <div class="legend" style="margin-bottom:14px">
    <span><i style="background:rgba(47,91,234,.25)"></i>Shift hours</span>
    <span><i style="background:#991b1b"></i>Critical</span><span><i style="background:#dc2626"></i>High</span>
    <span><i style="background:#d97706"></i>Medium</span><span><i style="background:#16a34a"></i>Low</span>
    <span><i style="background:repeating-linear-gradient(135deg,#d97706 0 4px,#f59e0b 4px 8px)"></i>Striped = supporting technician</span>
  </div>
  <div id="techs"></div>
  <section class="card hidden" id="unsched" style="margin-top:18px">
    <div class="card-head"><h2>Open work orders without a booking</h2></div>
    <div id="unschedList"></div>
  </section>
</main>

<script src="common.js"></script>
<script src="trace.js"></script>
<script>
let orders = new Map(), machines = new Map();
const DAY = 86400000;

function today() { return new Date().toISOString().slice(0, 10); }
function shiftDate(d, n) { return new Date(Date.parse(d + "T00:00:00Z") + n * DAY).toISOString().slice(0, 10); }

function render(s) {
  const dayStart = Date.parse(s.date + "T00:00:00Z");
  const pct = (ms) => Math.max(0, Math.min(100, ((ms - dayStart) / DAY) * 100));
  const hours = Array.from({ length: 9 }, (_, i) => `<span style="left:${(i * 3 / 24) * 100}%">${pad(i * 3)}:00</span>`).join("");

  $("techs").innerHTML = s.technicians.map((t) => {
    const util = t.shiftMinutes ? Math.round((t.bookedMinutes / t.shiftMinutes) * 100) : 0;
    const shifts = t.shiftBlocks.map((b) => `<div class="shift" style="left:${pct(Date.parse(b.start))}%;width:${pct(Date.parse(b.end)) - pct(Date.parse(b.start))}%"></div>`).join("");
    const blocks = t.entries.map((x) => {
      const l = pct(Date.parse(x.start)), w = pct(Date.parse(x.end)) - l;
      return `<div class="blk p-${esc(x.priority)} ${x.role === "support" ? "support" : ""}" data-wo="${esc(x.workOrderId)}"
        style="left:${l}%;width:${Math.max(w, 1.5)}%" title="${esc(x.number)} · ${esc(x.machineName)} · ${esc(fmtTime(x.start))}-${esc(fmtTime(x.end))}">${esc(x.machineName)}</div>`;
    }).join("");
    const shiftText = t.shiftBlocks.length ? t.shiftBlocks.map((b) => `${fmtTime(b.start)}-${fmtTime(b.end) === "00:00" ? "24:00" : fmtTime(b.end)}`).join(", ") : "no shift this day";
    return `<section class="tech ${t.available ? "" : "off"}">
      <div class="tech-head">
        <div style="display:flex;gap:10px;align-items:center">
          <div class="avatar" style="width:36px;height:36px;font-size:12px">${esc(initials(t.name))}</div>
          <div><b>${esc(t.name)}</b> ${t.available ? "" : badge("critical", "Unavailable")}<div class="muted">${esc(t.role)} · ${esc(t.shift)} shift (${esc(shiftText)} UTC)</div></div>
        </div>
        <div class="muted">${esc(fmtMinutes(t.bookedMinutes))} booked of ${esc(fmtMinutes(t.shiftMinutes))} · ${util}% used</div>
      </div>
      <div class="hours">${hours}</div>
      <div class="tl">${shifts}${blocks}</div>
      <div class="agenda">${t.entries.map((x) => `
        <div class="agenda-row" data-wo="${esc(x.workOrderId)}">
          <b>${esc(fmtTime(x.start))} - ${esc(fmtTime(x.end))}</b>
          <div>${esc(x.title)}<div class="muted">${esc(x.number)} · ${esc(x.machineName)}${x.role === "support" ? ` · supporting: ${esc(x.focus || "")}` : x.crew.length > 1 ? ` · with ${esc(x.crew.filter((n) => n !== t.name).join(", "))}` : ""}</div></div>
          <div>${badge(x.role)} ${badge(x.status)}</div>
        </div>`).join("") || `<div class="muted">No work planned for this day.</div>`}</div>
    </section>`;
  }).join("");

  $("unsched").classList.toggle("hidden", !s.unscheduled.length);
  $("unschedList").innerHTML = s.unscheduled.map((w) => `<div class="wo" data-wo="${esc(w.id)}"><div><b>${esc(w.title)}</b><div class="muted">${esc(w.number)} · ${esc(w.machineName)}</div></div><div>${badge(w.priority)}</div></div>`).join("");
}

async function load() {
  try {
    $("err").textContent = "";
    $("date").value ||= today();
    const [s, wos, ms] = await Promise.all([api(`/api/schedule?date=${$("date").value}`), api("/api/workorders"), api("/api/machines")]);
    orders = new Map(wos.map((w) => [w.id, w]));
    machines = new Map(ms.map((m) => [m.id, m.name]));
    render(s);
  } catch (e) { $("err").textContent = e.message; }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-wo]");
  const w = el && orders.get(el.dataset.wo);
  if (w) showBrief({ ...w, machineName: machines.get(w.machineId) });
});
$("date").onchange = load;
$("prev").onclick = () => { $("date").value = shiftDate($("date").value || today(), -1); load(); };
$("next").onclick = () => { $("date").value = shiftDate($("date").value || today(), 1); load(); };
$("today").onclick = () => { $("date").value = today(); load(); };

renderNav("schedule.html");
load();
</script>
</body>
</html>
